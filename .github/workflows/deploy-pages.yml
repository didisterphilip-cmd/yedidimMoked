name: פרסום האפליקציה (GitHub Pages)

# מפרסם את תוכן תיקיית www כאתר, כדי לפתוח אותו ב-Chrome ולהוסיף למסך הבית.
on:
  push:
    branches:
      - claude/emergency-call-form-app-npohh3
    paths:
      - 'www/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# מאפשר ריצה אחת בכל פעם
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
