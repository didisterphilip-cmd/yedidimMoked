name: בניית אפליקציית אנדרואיד (APK)

# בונה קובץ APK להתקנה בטלפון.
# רץ אוטומטית בכל דחיפה לענף, וניתן גם להריץ ידנית מלשונית Actions.
on:
  push:
    branches:
      - claude/emergency-call-form-app-npohh3
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate icons from logo
        run: npm run gen:icons

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/moked-artzi.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: moked-artzi-apk
          path: out/moked-artzi.apk
          if-no-files-found: error

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: אפליקציית מוקד ארצי (גרסה אחרונה)
          body: |
            הורד את הקובץ moked-artzi.apk מטה מהטלפון והתקן אותו.
            נבנה אוטומטית מהקוד האחרון.
          prerelease: true
          files: out/moked-artzi.apk
